name: publish staging loadtest image

on:
  push:
    branches: [main]
    paths:
      - loadtests/**
      - .github/workflows/publish-loadtest.yml
  pull_request:
    branches: [main]
    paths:
      - loadtests/**
      - .github/workflows/publish-loadtest.yml

concurrency:
  group: loadtest-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate loadtest image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Infra source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build validation image
        run: docker build --file loadtests/Dockerfile --tag emporio-loadtest:ci loadtests

      - name: Validate k6 scripts
        run: |
          set -euo pipefail
          for script in api-radar.js radar-cnpj.js login-rate-limit.js; do
            docker run --rm emporio-loadtest:ci inspect "/opt/emporio/loadtests/$script" >/dev/null
          done

  publish:
    name: publish immutable loadtest image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Infra source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with the job token
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish loadtest image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./loadtests
          file: ./loadtests/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/emporiob2b/infra-loadtest:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Record published package reference
        env:
          IMAGE: ghcr.io/emporiob2b/infra-loadtest
          REVISION: ${{ github.sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            printf 'Image: %s:sha-%s\n\n' "$IMAGE" "$REVISION"
            printf 'Digest-pinned reference: %s@%s\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
